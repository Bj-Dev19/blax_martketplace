# Shared security headers for every response, including static assets.
#
# Why a snippet instead of only the server block:
# nginx does NOT inherit add_header directives into a location block that
# declares its own add_header. The cache locations in nginx.conf.template set
# Cache-Control, so without this include they would silently drop every
# security header. Any location that adds its own header must include this file.
#
# ${PORT} is deliberately absent: envsubst is restricted to '${PORT}' only, so
# every other $var here must be a real nginx variable. $hsts_header is mapped
# from X-Forwarded-Proto in nginx.conf.template and is empty for plain HTTP,
# and nginx omits an add_header whose value is empty.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
add_header Strict-Transport-Security $hsts_header always;
